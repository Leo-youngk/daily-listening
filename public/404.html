<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>资源不存在 · 每日听力</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f6f7f9;
        color: #1a1d21;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101216; color: #f2f3f5; }
      }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; font-size: 13px; color: #8a8f98; line-height: 1.6; }
      a {
        margin-top: 8px;
        padding: 10px 20px;
        border-radius: 999px;
        background: #2f8fe0;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>资源不存在</h1>
    <p>请求的素材或数据文件在服务器上找不到。<br />如果是刚更新过，稍后重试即可。</p>
    <a href="/">返回首页</a>
  </body>
</html>
